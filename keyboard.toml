# Documentation: https://haobogu.github.io/rmk/keyboard_configuration.html
[keyboard]
name = "RMK Keyboard"
product_name = "RMK Keyboard"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "haobo"
chip = "nrf52840"
# board = "nice!nano_v2"

[[input_device.joystick]]
name = "default"
pin_x = "P0_31"
pin_y = "P0_29"
pin_z = "_"
transform = [[80, 0], [0, 80]]
bias = [29130, 29365]
resolution = 6
# func = "mouse | n-direction key" # TODO: only mouse is supported now

[matrix]
matrix_type = "direct_pin"
# `direct_pin_low_active` is optional. Default to `true`.
direct_pin_low_active = true
direct_pins = [
["P0_09", "P0_02", "P1_15"], 
["P1_13", "P1_11", "P0_10"], 
["P0_08", "P0_06", "P0_24"], 
["P1_00", "P0_11", "P1_04"],
]

[layout]
rows = 4
cols = 3
layers = 12
keymap = [
    [
        ["A", "B", "C"],
        ["D", "E", "F"],
        ["G", "H", "I"],
        ["J", "K", "L"]
    ],
